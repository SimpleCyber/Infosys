name: 24-Hour Midnight Campus Menus Purge Cron

on:
  schedule:
    # 12:00 AM midnight IST (6:30 PM UTC) - Daily midnight fresh start
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 24-Hour Midnight Purge Cleanup API
        run: |
          curl -X POST "${{ secrets.BACKEND_API_URL }}/api/cron/cleanup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
