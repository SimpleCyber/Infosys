name: Purge Expired Campus Menus Cron

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    # In IST (UTC+5:30): 05:30 AM, 11:30 AM (Pre-Lunch), 05:30 PM (Pre-Dinner), 11:30 PM (Night Reset)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Purge Cleanup API
        run: |
          curl -X POST "${{ secrets.BACKEND_API_URL }}/api/cron/cleanup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
