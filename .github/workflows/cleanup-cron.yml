name: Purge Expired Campus Menus Cron

on:
  schedule:
    # 5:05 PM IST (11:35 AM UTC) - After Lunch window passes
    - cron: '35 11 * * *'
    # 12:05 AM IST (6:35 PM UTC) - After Dinner window passes
    - cron: '35 18 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Purge Cleanup API
        run: |
          curl -X POST "${{ secrets.BACKEND_API_URL }}/api/cron/cleanup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
